name: iOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed:
        description: Export a signed IPA using repository signing secrets
        type: boolean
        default: false
      export_method:
        description: Must match the provisioning profile
        type: choice
        options: [debugging, release-testing, app-store-connect]
        default: debugging
      testflight:
        description: Upload signed App Store build to App Store Connect for TestFlight
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate catalog
        run: python3 scripts/validate_catalog.py
      - name: Validate release selection
        env:
          UPLOAD_TESTFLIGHT: ${{ inputs.testflight }}
          SIGNED: ${{ inputs.signed }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          if [ "$UPLOAD_TESTFLIGHT" = true ]; then
            test "$SIGNED" = true && test "$EXPORT_METHOD" = app-store-connect || { echo 'TestFlight requires signed=true and export_method=app-store-connect'; exit 1; }
          fi
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
          echo "ARK_BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Build unsigned device application
        run: |
          set -o pipefail
          xcodebuild build -project ARKFieldGuide.xcodeproj -scheme ARKFieldGuide -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/Device CURRENT_PROJECT_VERSION="$ARK_BUILD_NUMBER" CODE_SIGNING_ALLOWED=NO | tee build/device.log
          ditto -c -k --keepParent build/Device/Build/Products/Release-iphoneos/ARKFieldGuide.app build/ARKFieldGuide-unsigned-app.zip
      - name: Select iPhone simulator
        timeout-minutes: 5
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if "iOS" in k for v in vs if v["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Test on simulator
        timeout-minutes: 10
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild test -project ARKFieldGuide.xcodeproj -scheme ARKFieldGuide -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO | tee build/test.log
      - name: Capture simulator UI
        run: |
          xcrun simctl install "$DEVICE_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/ARKFieldGuide.app
          xcrun simctl launch "$DEVICE_ID" local.ark.fieldguide
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot build/iphone.png
      - name: Export signed IPA
        if: github.event_name == 'workflow_dispatch' && inputs.signed
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 || secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: bash scripts/export_signed.sh
      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && inputs.testflight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
        run: bash scripts/upload_testflight.sh
      - name: Remove temporary signing materials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ark-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/ark-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/ark-signing.p12" "$RUNNER_TEMP/ark-profile.mobileprovision" "$RUNNER_TEMP/ark-profile.plist"
          if [ -f "$RUNNER_TEMP/ark-installed-profile-path" ]; then
            PROFILE_PATH=$(cat "$RUNNER_TEMP/ark-installed-profile-path")
            case "$PROFILE_PATH" in "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision) rm -f "$PROFILE_PATH" ;; esac
          fi
          if [ -f "$RUNNER_TEMP/ark-api-key-path" ]; then
            KEY_PATH=$(cat "$RUNNER_TEMP/ark-api-key-path")
            case "$KEY_PATH" in "$HOME/.appstoreconnect/private_keys/AuthKey_"*.p8) rm -f "$KEY_PATH" ;; esac
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARKFieldGuide-build
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/*.log
            build/*.png
            build/*.zip
            build/Tests.xcresult
            build/Export/*.ipa
